<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Radi coffee</title>
  <!-- SDK Telegram отдаём со СВОЕГО домена (не с telegram.org) — иначе у юзеров с VPN,
       где telegram.org режется, скрипт не грузится и мини-апп не получает initData. -->
  <script src="/tg-sdk.js"></script>
  <!-- фолбэк: если своя копия почему-то не загрузилась — тянем с telegram.org -->
  <script>
    if (!window.Telegram || !window.Telegram.WebApp) {
      document.write('<script src="https:\/\/telegram.org\/js\/telegram-web-app.js"><\/script>');
    }
  </script>
  <!-- Сторож запуска. НАМЕРЕННО на старом синтаксисе (без стрелок, `?.` и `??`):
       он должен работать даже там, где основной код не смог выполниться.
       Если приложение не стартовало за 9 секунд — сообщаем на сервер и показываем
       текст вместо чёрного экрана, по которому раньше нельзя было понять ничего. -->
  <script>
    (function () {
      var firstError = '';
      window.addEventListener('error', function (e) {
        if (!firstError) firstError = (e && (e.message || (e.error && e.error.message))) || 'ошибка загрузки';
      }, true);
      setTimeout(function () {
        if (window.__radiBooted) return;
        try {
          var x = new XMLHttpRequest();
          x.open('POST', '/api/beacon', true);
          x.setRequestHeader('Content-Type', 'application/json');
          x.send(JSON.stringify({
            step: 'boot',
            message: (firstError || 'код не запустился') + ' | ' + navigator.userAgent,
            platform: 'unknown',
            app_version: (location.search.match(/v=(\d+)/) || [])[1] || ''
          }));
        } catch (err) {}
        var root = document.getElementById('root');
        if (root && !root.firstChild) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;'
            + 'align-items:center;justify-content:center;padding:30px;text-align:center;'
            + 'font-family:Manrope,-apple-system,sans-serif;color:#8C857A;background:#100F0C">'
            + '<div style="width:60px;height:60px;border:1.5px solid #C2A079;border-radius:16px;'
            + 'display:flex;align-items:center;justify-content:center;color:#C2A079;font-weight:700;'
            + 'font-size:28px;margin-bottom:16px">R</div>'
            + '<div style="color:#F3EEE2;font-size:18px;font-weight:700;margin-bottom:10px">Radi coffee</div>'
            + '<div style="font-size:13.5px;line-height:1.5">Карта не открылась на этом телефоне.<br>'
            + 'Покажите этот экран баристе — он отметит кофе вручную.</div></div>';
        }
      }, 9000);
    })();
  </script>
  <!-- Шрифт НЕ тянем с fonts.googleapis.com. Это была блокирующая таблица стилей:
       пока она не придёт, браузер не выполняет скрипты после неё, и у кого Google
       недоступен — приложение не стартовало вообще (чёрный экран, ни одного запроса
       к серверу). По логам так падала треть заходов. Теперь шрифт лежит у нас,
       подключается через src/fonts.css и попадает в общий файл стилей. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
