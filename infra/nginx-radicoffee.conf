# Radi Coffee — host nginx vhost для radicoffee.consoleai.ru
# Статика мини-аппа из /opt/radicoffee/frontend/dist, /api → backend :8014.
# SSL-блок добавляет certbot --nginx после выпуска сертификата.

server {
    listen 80;
    listen [::]:80;
    server_name radicoffee.consoleai.ru;

    # Сжатие. Без него JS уходил целиком (208 КБ вместо 67) и на слабой мобильной
    # связи в кофейне загрузка рвалась: клиент получал 206 и приложение не стартовало.
    # В nginx.conf gzip_types по умолчанию закомментирован, поэтому задаём здесь.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml;

    # ACME-challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /opt/radicoffee/frontend/dist;
    index index.html;

    # API → backend (FastAPI на loopback)
    location /api/ {
        proxy_pass http://127.0.0.1:8014;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # статика с кэшем
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Шрифты лежат у нас (не с fonts.googleapis.com — тот блокировал запуск
    # приложения у тех, кому Google недоступен). Имена файлов постоянные,
    # поэтому кэшируем надолго: иначе на слабой связи в кофейне они качались бы
    # при каждом открытии карты, а правило ниже запрещает кэш всему остальному.
    location /fonts/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html НЕ кэшируем — иначе клиент тянет старый JS из кэша Telegram WebView
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Telegram Mini App должен открываться в iframe Telegram — НЕ ставим X-Frame-Options DENY.
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/radicoffee.access.log;
    error_log  /var/log/nginx/radicoffee.error.log;
}
